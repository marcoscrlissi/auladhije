<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria com efeito fumê</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main>
    <div class="galeria">
      <!-- Os botões permitem selecionar as imagens pelo teclado. -->
      <button type="button" aria-label="Ampliar imagem de água-viva">
        <img src="imagens/ia1.png" alt="Água-viva">
      </button>


      <button type="button" aria-label="Ampliar imagem de coala">
        <img src="imagens/ia2.png" alt="Coala">
      </button>


      <button type="button" aria-label="Ampliar paisagem de deserto">
        <img src="imagens/ia3.png" alt="Paisagem de deserto">
      </button>


      <button type="button" aria-label="Ampliar flores em um lago">
        <img src="imagens/ia4.png" alt="Flores em um lago">
      </button>


      <button type="button" aria-label="Ampliar casas próximas ao lago">
        <img src="imagens/ia5.png" alt="Casas próximas ao lago">
      </button>


      <button type="button" aria-label="Ampliar rio com árvores">
        <img src="imagens/ia6.png" alt="Rio com árvores">
      </button>

      <button type="button" aria-label="Ampliar casas próximas ao lago">
        <img src="imagens/ia7.jpeg" alt="Casas próximas ao lago">
      </button>
      <button type="button" aria-label="Ampliar casas próximas ao lago">
        <img src="imagens/ia8.jpeg" alt="Casas próximas ao lago">
      </button>
    </div>
  </main>


  <!-- Janela que apresenta a imagem ampliada. -->
  <dialog class="ampliacao" aria-label="Imagem ampliada">
    <button class="fechar" type="button"
      aria-label="Fechar imagem ampliada">
      &times;
    </button>


    <img class="imagem-ampliada" alt="">
  </dialog>
 
  <script src="script.js"></script>
</body>
</html>
